[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 本机 USB 链路在高波特率下不稳定，烧录用 115200
upload_speed = 115200
upload_port = /dev/cu.usbserial-114110
monitor_port = /dev/cu.usbserial-114110

; 位操作直读 XPT2046，不依赖任何库
[env:raw]
build_src_filter = +<main.cpp>

; 通过 LovyanGFX 读触摸，逐步打点定位丢失按压的环节
[env:lgfx]
build_src_filter = +<lgfx_diag.cpp>
build_flags = -I../touch_test/src
lib_deps = lovyan03/LovyanGFX@^1.2.0
