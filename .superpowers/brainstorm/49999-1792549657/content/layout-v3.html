<style>
  .scr { width:240px; height:320px; background:#0b0d10; color:#e8eaed; font-family:-apple-system,"PingFang SC",sans-serif;
         box-sizing:border-box; overflow:hidden; position:relative; zoom:1.6; outline:6px solid #222; border-radius:2px; margin:0 auto; }
  .lbl { font-size:12px; color:#8a9099; letter-spacing:1px; }
  .unit { font-size:12px; color:#8a9099; font-weight:400; }
  .num { font-size:28px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }
  .b { color:#64d2ff } .o { color:#ff9f0a }
  .wrap { display:flex; gap:48px; align-items:flex-start; justify-content:center; flex-wrap:wrap; padding:24px 0 }
  .notes { max-width:340px; font-size:14px; line-height:1.7 }
  .notes li { margin-bottom:6px }
</style>

<h2>组合方案：上面圆环，下面网络曲线</h2>
<p class="subtitle">竖放 240×320，按 1.6 倍放大显示。数据是假的。</p>

<div class="wrap">
  <div class="scr" style="padding:10px 12px">
    <div style="display:flex;justify-content:space-between">
      <svg width="104" height="118" viewBox="0 0 104 118">
        <circle cx="52" cy="50" r="40" fill="none" stroke="#1c2026" stroke-width="11"/>
        <circle cx="52" cy="50" r="40" fill="none" stroke="#34c759" stroke-width="11" stroke-linecap="round"
                stroke-dasharray="93 251.3" transform="rotate(-90 52 50)"/>
        <text x="52" y="59" text-anchor="middle" font-size="26" font-weight="700" fill="#e8eaed">37</text>
        <text x="52" y="112" text-anchor="middle" font-size="12" fill="#8a9099">CPU %</text>
      </svg>
      <svg width="104" height="118" viewBox="0 0 104 118">
        <circle cx="52" cy="50" r="40" fill="none" stroke="#1c2026" stroke-width="11"/>
        <circle cx="52" cy="50" r="40" fill="none" stroke="#ffcc00" stroke-width="11" stroke-linecap="round"
                stroke-dasharray="155.8 251.3" transform="rotate(-90 52 50)"/>
        <text x="52" y="59" text-anchor="middle" font-size="26" font-weight="700" fill="#ffcc00">62</text>
        <text x="52" y="112" text-anchor="middle" font-size="12" fill="#8a9099">内存压力 %</text>
      </svg>
    </div>

    <div style="border-top:1px solid #1c2026;margin-top:6px;padding-top:8px">
      <div style="display:flex;justify-content:space-between">
        <div><div class="lbl">↓ 下载</div><div class="num b">12.4<span class="unit"> MB/s</span></div></div>
        <div style="text-align:right"><div class="lbl">↑ 上传</div><div class="num o">860<span class="unit"> KB/s</span></div></div>
      </div>
      <svg width="216" height="96" viewBox="0 0 216 96" style="margin-top:8px;display:block">
        <line x1="0" y1="10" x2="216" y2="10" stroke="#1c2026" stroke-dasharray="3 3"/>
        <text x="216" y="7" text-anchor="end" font-size="10" fill="#5c626b">峰值 15 MB/s</text>
        <line x1="0" y1="94" x2="216" y2="94" stroke="#1c2026"/>
        <polygon fill="#64d2ff" fill-opacity="0.15" points="0,94 0,90 18,88 36,80 54,46 72,20 90,16 108,30 126,80 144,86 162,62 180,40 198,34 216,32 216,94"/>
        <polyline fill="none" stroke="#64d2ff" stroke-width="2" points="0,90 18,88 36,80 54,46 72,20 90,16 108,30 126,80 144,86 162,62 180,40 198,34 216,32"/>
        <polyline fill="none" stroke="#ff9f0a" stroke-width="2" points="0,92 18,91 36,90 54,88 72,86 90,87 108,89 126,90 144,90 162,88 180,86 198,87 216,86"/>
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:#5c626b;margin-top:2px">
        <span>5 分钟前</span><span>现在</span>
      </div>
    </div>
  </div>

  <div class="notes">
    <h3>这一版是怎么排的</h3>
    <ul>
      <li>上半屏：CPU 和内存压力两个圆环，沿用 B 的样式。</li>
      <li>圆环颜色跟着数值变：低于 50% 绿色，50–80% 黄色，80% 以上红色（我定的阈值，可改）。</li>
      <li>下半屏：下载（蓝）和上传（橙）两个当前值，下面一条两色曲线，显示最近 5 分钟。</li>
      <li>曲线高度按这 5 分钟里的峰值自动缩放，右上角小字标出峰值。</li>
    </ul>
  </div>
</div>
